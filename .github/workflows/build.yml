name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar CarGO v4 (Prius) y revisar que el Jeep siga compilando
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePriusRelease :app:assembleJeepRelease :app:lintPriusRelease --no-daemon

      - name: Resultado de lint
        if: always()
        run: cat app/build/lint.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: CarGO-v4-Prius-apk
          path: app/build/outputs/apk/prius/release/*.apk
