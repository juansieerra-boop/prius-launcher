name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assemblePriusRelease assembleJeepRelease lintPriusDebug --no-daemon

      - name: Resultado de lint
        run: cat app/build/lint.txt || true

      - name: Revisar el Jeep también
        run: |
          ./gradlew lintJeepDebug --no-daemon
          cat app/build/lint.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: PriusLauncher-apk
          path: app/build/outputs/apk/prius/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JeepLauncher-apk
          path: app/build/outputs/apk/jeep/release/*.apk
