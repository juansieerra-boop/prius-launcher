name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar CarGo (rama cargo-core)
        run: |
          chmod +x gradlew
          ./gradlew :cargo:assembleDebug :cargo:assembleRelease :cargo:lintPriusDebug :cargo:lintJeepDebug --no-daemon || (cat cargo/build/lint.txt; exit 1)

      - name: Resultado de lint CarGo
        if: always()
        run: cat cargo/build/lint.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: CarGo-Prius-apk
          path: cargo/build/outputs/apk/prius/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarGo-Jeep-apk
          path: cargo/build/outputs/apk/jeep/debug/*.apk
