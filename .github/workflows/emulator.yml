name: Probar en emulador

on:
  workflow_dispatch:
  push:
    branches: [v4-cargo]

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Cada carro con la versión de Android real de su pantalla
        include:
          - { flavor: prius, task: PriusRelease, api: 28, size: 1024x600 }
          - { flavor: prius, task: PriusRelease, api: 28, size: 1280x720 }
          - { flavor: jeep,  task: JeepRelease,  api: 27, size: 1280x720 }
    name: CarGO v4 ${{ matrix.flavor }} (API ${{ matrix.api }}, ${{ matrix.size }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assemble${{ matrix.task }} --no-daemon

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador · instalar, abrir y probar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin ${{ matrix.size }}
          script: bash .github/scripts/emu_v4.sh ${{ matrix.size }} ${{ matrix.flavor }}
