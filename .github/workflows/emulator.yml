name: Probar en emulador

on:
  workflow_dispatch:
  push:
    branches: [cargo-core]

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cada carro con la versión de Android y la resolución REALES de su pantalla
          - flavor: prius
            api: 28
            size: 1024x600
          - flavor: jeep
            api: 27
            size: 1280x720
    name: ${{ matrix.flavor }} (API ${{ matrix.api }}, ${{ matrix.size }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew :cargo:assemble${{ matrix.flavor == 'prius' && 'Prius' || 'Jeep' }}Debug --no-daemon

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador · instalar y abrir
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin ${{ matrix.size }}
          script: bash .github/scripts/emu_test.sh ${{ matrix.flavor }} ${{ matrix.size }}
