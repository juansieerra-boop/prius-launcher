name: Probar en emulador

on:
  workflow_dispatch:
  push:
    branches: [cargo-core]

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cada carro con la versión de Android y la resolución REALES de su pantalla
          # app = launcher aprobado (PriusLauncher) · cargo = producto comercial CarGo
          - { module: app,   flavor: prius, task: PriusRelease, api: 28, size: 1024x600, pkg: com.juandiego.priuslauncher, act: com.juandiego.priuslauncher.MainActivity }
          - { module: app,   flavor: jeep,  task: JeepRelease, api: 27, size: 1280x720, pkg: com.juandiego.jeeplauncher,  act: com.juandiego.priuslauncher.MainActivity }
          - { module: cargo, flavor: prius, task: PriusDebug, api: 28, size: 1024x600, pkg: com.cargo.launcher.prius,    act: com.cargo.launcher.MainActivity }
          - { module: cargo, flavor: jeep,  task: JeepDebug,  api: 27, size: 1280x720, pkg: com.cargo.launcher.jeep,     act: com.cargo.launcher.MainActivity }
    name: ${{ matrix.module }} ${{ matrix.flavor }} (API ${{ matrix.api }}, ${{ matrix.size }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}   # igual que la versión aprobada
        run: |
          chmod +x gradlew
          ./gradlew :${{ matrix.module }}:assemble${{ matrix.task }} --no-daemon

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador · instalar y abrir
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin ${{ matrix.size }}
          script: bash .github/scripts/emu_test.sh ${{ matrix.module }} ${{ matrix.flavor }} ${{ matrix.size }} ${{ matrix.pkg }} ${{ matrix.act }}
